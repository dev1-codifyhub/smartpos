<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Smart POS</title>
  <meta name="theme-color" content="#DC2626">
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F4F6FA; color: #172033; }
    .box { max-width: 380px; text-align: center; background: rgba(255,255,255,.8); border-radius: 24px; padding: 32px 26px; box-shadow: 0 18px 50px rgba(23,32,51,.12); }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 20px; margin: 16px 0 8px; } p { color: #8A94A6; line-height: 1.6; margin: 0 0 20px; }
    button { height: 46px; padding: 0 24px; border: 0; border-radius: 14px; background: #DC2626; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <img src="assets/icons/icon-192.png" alt="Smart POS">
    <h1>Anda sedang offline</h1>
    <p>Smart POS belum tersimpan di perangkat ini. Hubungkan ke internet sekali untuk memuat aplikasi, setelah itu aplikasi dapat dipakai tanpa koneksi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
