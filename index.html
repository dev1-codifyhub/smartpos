<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart POS</title>
  <meta name="description" content="Smart POS - aplikasi kasir modern, offline-first, untuk toko retail, minimarket, dan kafe.">
  <meta name="theme-color" content="#DC2626">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart POS">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/print.css">
  <script>
    // Apply saved theme before first paint (no flash)
    var th = 'dark'; try { th = JSON.parse(localStorage.getItem('spos:theme')) || 'dark'; } catch (e) {} document.documentElement.setAttribute('data-theme', th);
  </script>
</head>
<body>
  <div id="splash"><div class="splash-inner"><img src="assets/icons/icon-192.png" alt=""><b>Smart POS</b><small>Memuat aplikasi…</small></div></div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <img src="assets/icons/icon-192.png" alt="Smart POS">
        <div class="brand-text"><b>Smart POS</b><small>Kasir Pintar</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="profile" id="profile"></div>
        <button class="btn btn-ghost btn-sm collapse-btn" id="collapseBtn" aria-label="Ciutkan sidebar"><i data-lucide="panel-left-close"></i><span>Ciutkan</span></button>
      </div>
    </aside>
    <div class="scrim" id="drawerScrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-toggle" id="menuToggle" aria-label="Menu"><i data-lucide="menu"></i></button>
        <div class="avatar top-avatar" id="topAvatar"></div>
        <div class="titles">
          <div class="crumbs" id="crumbs"></div>
          <h1 id="pageTitle">Smart POS</h1>
        </div>
        <div class="topbar-actions">
          <span class="net-pill" id="netPill" title="Status jaringan"><i class="dot"></i><span class="txt">Online</span></span>
          <button class="btn btn-sm hidden" id="installBtn"><i data-lucide="download"></i><span>Pasang</span></button>
          <a class="btn btn-ghost btn-icon btn-sm bell" href="#/inventory" id="bellBtn" aria-label="Peringatan stok"><i data-lucide="bell"></i><i class="bell-dot hidden" id="bellDot"></i></a>
          <button class="btn btn-ghost btn-icon btn-sm" id="themeBtn" aria-label="Ganti tema"><i data-lucide="moon"></i></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi bawah"></nav>
  <div id="toasts" aria-live="polite"></div>
  <div id="print-area"></div>

  <script src="assets/vendor/lucide.min.js" defer></script>
  <script src="assets/vendor/chart.umd.js" defer></script>
  <script src="assets/vendor/JsBarcode.all.min.js" defer></script>
  <script src="assets/vendor/html5-qrcode.min.js" defer></script>
  <script src="assets/vendor/jspdf.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
  <noscript>Smart POS membutuhkan JavaScript.</noscript>
</body>
</html>
